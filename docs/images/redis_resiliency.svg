<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="100%" height="100%" style="background-color: #0f172a; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <text x="440" y="35" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle">Redis Resiliency: Fail-Open vs Fail-Closed Strategy</text>
  <text x="440" y="55" fill="#94a3b8" font-size="13" text-anchor="middle">Behavioral Flow during Redis Outage / Network Partition</text>

  <!-- Event -->
  <rect x="310" y="80" width="260" height="50" rx="8" fill="#7f1d1d" stroke="#ef4444" stroke-width="2"/>
  <text x="440" y="110" fill="#fca5a5" font-size="14" font-weight="bold" text-anchor="middle">⚠️ Redis Unavailability Event</text>

  <!-- Decision -->
  <polygon points="440,165 560,210 440,255 320,210" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="440" y="215" fill="#fbbf24" font-size="13" font-weight="bold" text-anchor="middle">Operation Type?</text>

  <!-- Line from Event to Decision -->
  <path d="M 440 130 L 440 165" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Outcome Cards -->
  <!-- Branch 1: Idempotency -->
  <rect x="40" y="330" width="180" height="110" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="130" y="355" fill="#a7f3d0" font-size="12" font-weight="bold" text-anchor="middle">Idempotency Key</text>
  <rect x="55" y="370" width="150" height="24" rx="4" fill="#047857"/>
  <text x="130" y="386" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">FAIL-OPEN</text>
  <text x="130" y="412" fill="#d1fae5" font-size="10" text-anchor="middle">Proceed to DB</text>
  <text x="130" y="426" fill="#6ee7b7" font-size="9" text-anchor="middle">(DB UK protects key)</text>

  <!-- Branch 2: Rate Limit -->
  <rect x="250" y="330" width="180" height="110" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="340" y="355" fill="#a7f3d0" font-size="12" font-weight="bold" text-anchor="middle">Rate Limit Check</text>
  <rect x="265" y="370" width="150" height="24" rx="4" fill="#047857"/>
  <text x="340" y="386" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">FAIL-OPEN</text>
  <text x="340" y="412" fill="#d1fae5" font-size="10" text-anchor="middle">Bypass limit with warning</text>
  <text x="340" y="426" fill="#6ee7b7" font-size="9" text-anchor="middle">(Prevent Blocking Users)</text>

  <!-- Branch 3: Read Cache -->
  <rect x="460" y="330" width="180" height="110" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="550" y="355" fill="#a7f3d0" font-size="12" font-weight="bold" text-anchor="middle">Read Cache Write</text>
  <rect x="475" y="370" width="150" height="24" rx="4" fill="#047857"/>
  <text x="550" y="386" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">FAIL-OPEN</text>
  <text x="550" y="412" fill="#d1fae5" font-size="10" text-anchor="middle">Skip cache update</text>
  <text x="550" y="426" fill="#6ee7b7" font-size="9" text-anchor="middle">(Schedule reconciliation)</text>

  <!-- Branch 4: Voucher Lock -->
  <rect x="670" y="330" width="180" height="110" rx="8" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/>
  <text x="760" y="355" fill="#fca5a5" font-size="12" font-weight="bold" text-anchor="middle">Voucher RLock</text>
  <rect x="685" y="370" width="150" height="24" rx="4" fill="#b91c1c"/>
  <text x="760" y="386" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">FAIL-CLOSED</text>
  <text x="760" y="412" fill="#fecaca" font-size="10" text-anchor="middle">Return 503 ServiceBusy</text>
  <text x="760" y="426" fill="#fca5a5" font-size="9" text-anchor="middle">(Protect Voucher Integrity)</text>

  <!-- Arrows from Decision to Branches -->
  <path d="M 360 230 L 130 330" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 410 245 L 340 330" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 470 245 L 550 330" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 520 230 L 760 330" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
