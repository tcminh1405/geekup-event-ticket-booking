<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%" style="background-color: #0f172a; font-family: system-ui, -apple-system, sans-serif;">
  <text x="480" y="35" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle">PostgreSQL Database Schema ERD</text>
  <text x="480" y="55" fill="#94a3b8" font-size="13" text-anchor="middle">Relational Entities &amp; Referential Constraints</text>

  <!-- Entity Cards -->
  <!-- CONCERTS -->
  <g transform="translate(40, 90)">
    <rect x="0" y="0" width="250" height="200" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="250" height="32" rx="8" fill="#1e40af"/>
    <text x="125" y="22" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">CONCERTS</text>
    <text x="15" y="55" fill="#f59e0b" font-size="11" font-family="monospace">PK  id : bigint</text>
    <text x="15" y="75" fill="#cbd5e1" font-size="11" font-family="monospace">    name : varchar(255)</text>
    <text x="15" y="95" fill="#cbd5e1" font-size="11" font-family="monospace">    venue : varchar(255)</text>
    <text x="15" y="115" fill="#cbd5e1" font-size="11" font-family="monospace">    concert_date : timestamp</text>
    <text x="15" y="135" fill="#cbd5e1" font-size="11" font-family="monospace">    published : boolean</text>
    <text x="15" y="155" fill="#94a3b8" font-size="11" font-family="monospace">    created_at : timestamp</text>
    <text x="15" y="175" fill="#94a3b8" font-size="11" font-family="monospace">    updated_at : timestamp</text>
  </g>

  <!-- TICKET_CATEGORIES -->
  <g transform="translate(350, 90)">
    <rect x="0" y="0" width="260" height="220" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="260" height="32" rx="8" fill="#1e40af"/>
    <text x="130" y="22" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">TICKET_CATEGORIES</text>
    <text x="15" y="55" fill="#f59e0b" font-size="11" font-family="monospace">PK  id : bigint</text>
    <text x="15" y="75" fill="#60a5fa" font-size="11" font-family="monospace">FK  concert_id : bigint</text>
    <text x="15" y="95" fill="#cbd5e1" font-size="11" font-family="monospace">    name : varchar(100)</text>
    <text x="15" y="115" fill="#cbd5e1" font-size="11" font-family="monospace">    price : numeric(15,2)</text>
    <text x="15" y="135" fill="#cbd5e1" font-size="11" font-family="monospace">    total_quantity : int</text>
    <text x="15" y="155" fill="#34d399" font-size="11" font-family="monospace">    available_quantity : int</text>
    <text x="15" y="175" fill="#cbd5e1" font-size="11" font-family="monospace">    sold_quantity : int</text>
    <text x="15" y="195" fill="#94a3b8" font-size="11" font-family="monospace">    created_at / updated_at</text>
  </g>

  <!-- BOOKINGS -->
  <g transform="translate(660, 90)">
    <rect x="0" y="0" width="260" height="250" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="260" height="32" rx="8" fill="#1e40af"/>
    <text x="130" y="22" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">BOOKINGS</text>
    <text x="15" y="55" fill="#f59e0b" font-size="11" font-family="monospace">PK  id : bigint</text>
    <text x="15" y="75" fill="#cbd5e1" font-size="11" font-family="monospace">    user_id : bigint</text>
    <text x="15" y="95" fill="#60a5fa" font-size="11" font-family="monospace">FK  concert_id : bigint</text>
    <text x="15" y="115" fill="#60a5fa" font-size="11" font-family="monospace">FK  voucher_id : bigint</text>
    <text x="15" y="135" fill="#fbbf24" font-size="11" font-family="monospace">    state : varchar(30)</text>
    <text x="15" y="155" fill="#cbd5e1" font-size="11" font-family="monospace">    total_amount : numeric</text>
    <text x="15" y="175" fill="#a7f3d0" font-size="11" font-family="monospace">UK  idempotency_key</text>
    <text x="15" y="195" fill="#cbd5e1" font-size="11" font-family="monospace">    payment_deadline</text>
    <text x="15" y="215" fill="#cbd5e1" font-size="11" font-family="monospace">    payment_timestamp</text>
  </g>

  <!-- BOOKING_ITEMS -->
  <g transform="translate(40, 360)">
    <rect x="0" y="0" width="250" height="180" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="250" height="32" rx="8" fill="#334155"/>
    <text x="125" y="22" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">BOOKING_ITEMS</text>
    <text x="15" y="55" fill="#f59e0b" font-size="11" font-family="monospace">PK  id : bigint</text>
    <text x="15" y="75" fill="#60a5fa" font-size="11" font-family="monospace">FK  booking_id : bigint</text>
    <text x="15" y="95" fill="#60a5fa" font-size="11" font-family="monospace">FK  ticket_category_id</text>
    <text x="15" y="115" fill="#cbd5e1" font-size="11" font-family="monospace">    quantity : int</text>
    <text x="15" y="135" fill="#cbd5e1" font-size="11" font-family="monospace">    unit_price : numeric</text>
    <text x="15" y="155" fill="#cbd5e1" font-size="11" font-family="monospace">    subtotal : numeric</text>
  </g>

  <!-- VOUCHER_CAMPAIGNS -->
  <g transform="translate(350, 360)">
    <rect x="0" y="0" width="260" height="210" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="32" rx="8" fill="#334155"/>
    <text x="130" y="22" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">VOUCHER_CAMPAIGNS</text>
    <text x="15" y="55" fill="#f59e0b" font-size="11" font-family="monospace">PK  id : bigint</text>
    <text x="15" y="75" fill="#cbd5e1" font-size="11" font-family="monospace">    name : varchar(255)</text>
    <text x="15" y="95" fill="#cbd5e1" font-size="11" font-family="monospace">    discount_type : varchar</text>
    <text x="15" y="115" fill="#cbd5e1" font-size="11" font-family="monospace">    discount_value : numeric</text>
    <text x="15" y="135" fill="#cbd5e1" font-size="11" font-family="monospace">    max_usage_count : int</text>
    <text x="15" y="155" fill="#cbd5e1" font-size="11" font-family="monospace">    current_usage_count</text>
    <text x="15" y="175" fill="#94a3b8" font-size="11" font-family="monospace">    start_date / end_date</text>
  </g>

  <!-- VOUCHERS -->
  <g transform="translate(660, 360)">
    <rect x="0" y="0" width="260" height="210" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="32" rx="8" fill="#334155"/>
    <text x="130" y="22" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">VOUCHERS</text>
    <text x="15" y="55" fill="#f59e0b" font-size="11" font-family="monospace">PK  id : bigint</text>
    <text x="15" y="75" fill="#60a5fa" font-size="11" font-family="monospace">FK  campaign_id : bigint</text>
    <text x="15" y="95" fill="#a7f3d0" font-size="11" font-family="monospace">UK  code : varchar(16)</text>
    <text x="15" y="115" fill="#cbd5e1" font-size="11" font-family="monospace">    used : boolean</text>
    <text x="15" y="135" fill="#cbd5e1" font-size="11" font-family="monospace">    used_by_user_id</text>
    <text x="15" y="155" fill="#60a5fa" font-size="11" font-family="monospace">FK  used_in_booking_id</text>
    <text x="15" y="175" fill="#94a3b8" font-size="11" font-family="monospace">    used_at : timestamp</text>
  </g>

  <!-- Relationship Lines -->
  <line x1="290" y1="190" x2="350" y2="190" stroke="#38bdf8" stroke-width="2"/>
  <line x1="610" y1="190" x2="660" y2="190" stroke="#38bdf8" stroke-width="2"/>
  <line x1="610" y1="465" x2="660" y2="465" stroke="#38bdf8" stroke-width="2"/>
</svg>
