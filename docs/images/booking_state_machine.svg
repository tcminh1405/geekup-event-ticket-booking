<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="100%" height="100%" style="background-color: #0f172a; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <text x="440" y="35" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle">Booking Lifecycle State Machine</text>
  <text x="440" y="55" fill="#94a3b8" font-size="13" text-anchor="middle">Strict Valid State Transitions &amp; Inventory Synchronization</text>

  <!-- States -->
  <!-- Initial -->
  <circle cx="80" cy="220" r="14" fill="#38bdf8"/>
  <text x="80" y="252" fill="#94a3b8" font-size="11" text-anchor="middle">Start</text>

  <!-- PENDING -->
  <rect x="180" y="190" width="150" height="60" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="255" y="218" fill="#fbbf24" font-size="15" font-weight="bold" text-anchor="middle">PENDING</text>
  <text x="255" y="236" fill="#94a3b8" font-size="11" text-anchor="middle">Tickets Held (15m)</text>

  <!-- AWAITING_PAYMENT -->
  <rect x="420" y="190" width="170" height="60" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="505" y="218" fill="#60a5fa" font-size="14" font-weight="bold" text-anchor="middle">AWAITING_PAYMENT</text>
  <text x="505" y="236" fill="#94a3b8" font-size="11" text-anchor="middle">Gateway Processing</text>

  <!-- CONFIRMED -->
  <rect x="690" y="100" width="150" height="60" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="765" y="128" fill="#34d399" font-size="15" font-weight="bold" text-anchor="middle">CONFIRMED</text>
  <text x="765" y="146" fill="#94a3b8" font-size="11" text-anchor="middle">Payment Success</text>

  <!-- EXPIRED -->
  <rect x="420" y="340" width="150" height="60" rx="10" fill="#1e293b" stroke="#b45309" stroke-width="2"/>
  <text x="495" y="368" fill="#f59e0b" font-size="15" font-weight="bold" text-anchor="middle">EXPIRED</text>
  <text x="495" y="386" fill="#94a3b8" font-size="11" text-anchor="middle">Auto Ticket Restored</text>

  <!-- CANCELLED -->
  <rect x="690" y="280" width="150" height="60" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="765" y="308" fill="#fca5a5" font-size="15" font-weight="bold" text-anchor="middle">CANCELLED</text>
  <text x="765" y="326" fill="#94a3b8" font-size="11" text-anchor="middle">Inventory Restored</text>

  <!-- Transitions -->
  <!-- Start -> PENDING -->
  <path d="M 94 220 L 180 220" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="137" y="210" fill="#cbd5e1" font-size="10" text-anchor="middle">Reserve API</text>

  <!-- PENDING -> AWAITING_PAYMENT -->
  <path d="M 330 220 L 420 220" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="375" y="210" fill="#cbd5e1" font-size="10" text-anchor="middle">Pay API</text>

  <!-- PENDING -> EXPIRED -->
  <path d="M 255 250 L 255 370 L 420 370" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330" y="360" fill="#fcd34d" font-size="10" text-anchor="middle">Scheduler (15m Timeout)</text>

  <!-- AWAITING_PAYMENT -> CONFIRMED -->
  <path d="M 505 190 L 505 130 L 690 130" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="120" fill="#6ee7b7" font-size="10" text-anchor="middle">Gateway SUCCESS</text>

  <!-- AWAITING_PAYMENT -> CANCELLED -->
  <path d="M 570 240 L 690 295" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="620" y="255" fill="#fca5a5" font-size="10" text-anchor="middle">Gateway FAILED</text>

  <!-- PENDING -> CANCELLED -->
  <path d="M 330 200 L 690 300" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <text x="510" y="270" fill="#fca5a5" font-size="10" text-anchor="middle">Operator Cancel</text>
</svg>
